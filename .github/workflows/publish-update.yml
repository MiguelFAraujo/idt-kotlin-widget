name: Publish Update Manifest

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Update Manifest
        id: manifest
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed "s/.*versionName = \"\\(.*\\)\".*/\\1/")
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode = \\(.*\\).*/\\1/')
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/app-release.apk"
          cat > update.json <<EOF
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apkUrl": "$APK_URL",
            "changelog": "Release ${{ github.event.release.tag_name }}",
            "minVersionCode": 1
          }
          EOF
          echo "Generated update.json:"
          cat update.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update update.json on main branch
        run: |
          # Switch to main branch
          git checkout main

          # Copy update.json to updates/ folder
          mkdir -p updates
          cp update.json updates/update.json

          # Commit and push
          git add updates/update.json
          git commit -m "chore: update manifest to ${{ github.event.release.tag_name }}" || echo "No changes"
          git push origin main