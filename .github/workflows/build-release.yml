name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27b
          build-tools-version: '35.0.0'

      - name: Decode Keystore
        id: keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
          echo "keystore_path=release.keystore" >> $GITHUB_OUTPUT

      - name: Configure Keystore Properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get Version Info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed "s/.*versionName = \"\\(.*\\)\".*/\\1/")
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode = \\(.*\\).*/\\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Create Update Manifest
        id: manifest
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk"
          cat > update.json <<EOF
          {
            "versionName": "${{ steps.version.outputs.version_name }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "apkUrl": "$APK_URL",
            "changelog": "Release ${{ github.ref_name }}",
            "timestamp": $(date +%s)000
          }
          EOF
          cat update.json

      - name: Upload Update Manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: update.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## IDT Status v${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})

            APK assinado para instalação direta. O app detecta esta versão via `update.json` e auto-atualiza.

            ### Download
            - [app-release.apk](${{ steps.manifest.outputs.apk_url }})

            ### Verificação
            - `update.json` incluído no release
            - Assinado com keystore de release
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to GitHub Release (backup)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./app/build/outputs/apk/release/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive