name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Determine version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Verify APK is signed
        run: |
          ls app/build/outputs/apk/release/
          echo "SIGNED_APK=$(ls app/build/outputs/apk/release/ | grep -E '^app-release\.apk$' || echo app-release-unsigned.apk)" >> "$GITHUB_ENV"

      - name: Name APK artifact
        run: |
          mkdir -p dist
          cp "app/build/outputs/apk/release/$SIGNED_APK" dist/IDT-Status-Widget-${{ steps.version.outputs.tag }}.apk

      - name: Generate update.json
        run: |
          VERSION_TAG="${{ steps.version.outputs.tag }}"
          VERSION_CODE=$(grep -E 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]//g' | head -1)
          printf '{\n  "versionName": "%s",\n  "versionCode": %s,\n  "apkUrl": "https://github.com/%s/releases/download/%s/IDT-Status-Widget-%s.apk",\n  "changelog": "Versao %s do IDT Status Widget.",\n  "minVersionCode": 1\n}\n' \
            "$VERSION_TAG" "$VERSION_CODE" "${{ github.repository }}" "$VERSION_TAG" "$VERSION_TAG" "$VERSION_TAG" > dist/update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/IDT-Status-Widget-${{ steps.version.outputs.tag }}.apk
            dist/update.json

      - name: Publish Update Manifest to main
        run: |
          git fetch origin main
          git checkout main
          mkdir -p updates
          cp dist/update.json updates/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/update.json
          git commit -m "chore: update manifest to ${{ steps.version.outputs.tag }}" || echo "No changes"
          git push origin main
