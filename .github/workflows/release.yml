name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Determine version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Name APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/IDT-Status-Widget-${{ steps.version.outputs.tag }}.apk

      - name: Generate update.json
        run: |
          VERSION_TAG="${{ steps.version.outputs.tag }}"
          cat > dist/update.json <<EOF
          {
            "versionName": "$VERSION_TAG",
            "versionCode": 2,
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$VERSION_TAG/IDT-Status-Widget-$VERSION_TAG.apk",
            "changelog": "Versão $VERSION_TAG do IDT Status Widget.",
            "minVersionCode": 1
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/IDT-Status-Widget-${{ steps.version.outputs.tag }}.apk
            dist/update.json
